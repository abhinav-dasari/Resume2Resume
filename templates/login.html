{% extends "base.html" %}

{% block title %}Login — AI Form Auto-Filler{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Log in to access your document auto-fill workspace</p>
        </div>

        <form method="POST" action="/login" id="login-form">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" placeholder="Enter your username or email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="login-submit-btn">
                🔑 Log In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Create one here</a></p>
        </div>
    </div>
</div>
{% endblock %}
